<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MetaAgri</title>
    <meta name="description" content="A multi-level digital twin of a farm in the Oderbruch, from the whole planet down to a single field." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Crect x='1' y='1' width='24' height='24' rx='5' fill='none' stroke='%232b6650' stroke-width='2'/%3E%3Cpath d='M6 20.5h14' stroke='%232b6650' stroke-width='2' stroke-linecap='round' opacity='.6'/%3E%3Cpath d='M13 20V11.5' stroke='%232b6650' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M13 13.5C13 10 10.6 7.5 6.5 7.5 6.5 11 8.9 13.5 13 13.5Z' fill='%232b6650'/%3E%3Cpath d='M13 11.5C13 8.2 15.3 5.5 19.5 5.5 19.5 8.8 17.2 11.5 13 11.5Z' fill='%232b6650' opacity='.7'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/maps.css" />
    <link rel="stylesheet" href="styles/farm.css" />
    <link rel="stylesheet" href="styles/field.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="#earth" aria-label="MetaAgri, back to Earth">
          <svg viewBox="0 0 26 26" aria-hidden="true">
            <rect x="1" y="1" width="24" height="24" rx="5" fill="none" stroke="var(--accent)" stroke-width="2" />
            <path d="M6 20.5h14" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" opacity="0.6" />
            <path d="M13 20V11.5" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" />
            <path d="M13 13.5C13 10 10.6 7.5 6.5 7.5 6.5 11 8.9 13.5 13 13.5Z" fill="var(--accent)" />
            <path d="M13 11.5C13 8.2 15.3 5.5 19.5 5.5 19.5 8.8 17.2 11.5 13 11.5Z" fill="var(--accent)" opacity="0.7" />
          </svg>
          MetaAgri
        </a>
        <nav aria-label="Zoom level" style="display: contents">
          <ol class="ladder" id="ladder"></ol>
        </nav>
        <div class="simbar" id="simbar" role="toolbar" aria-label="Simulation controls"></div>
      </div>
      <div class="statusline" id="statusline"></div>
    </header>

    <main class="page" id="view" tabindex="-1"></main>

    <footer class="footer">
      <p>
        MetaAgri MVP. Every farm, field, crop and number here is simulated; farm names are fictional. Map data:
        Natural Earth (public domain), German states from deutschlandGeoJSON (Unlicense); the Oder river and Oderbruch
        outline simplified by hand.
      </p>
    </footer>

    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div class="sr-only" id="scenario-live" role="alert"></div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
