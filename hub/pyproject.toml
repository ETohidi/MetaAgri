[project]
name = "hub"
version = "0.1.0"
description = "MetaAgri hub - farm digital twin FastAPI app"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "pydantic>=2.9.0,<3.0",
    "requests>=2.32.0,<3.0",
    "uvicorn[standard]>=0.32.0,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hub"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
