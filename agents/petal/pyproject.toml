[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agri-petal"
version = "0.1.0"
description = "MetaAgri petal: a Flower AgentApp that proposes the day's farm work for one field, or reports a farm's spare capacity"
license = { file = "LICENSE" }
requires-python = ">=3.11,<4.0"
dependencies = [
    "flwr>=1.35.0,<2.0",
    "openai>=2.16.0,<3.0.0",
    "pydantic>=2.9.0,<3.0",
    "requests>=2.32.0,<3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["petal"]

[tool.flwr.app]
publisher = "flwrlabs"
fab-format-version = 1
flwr-version-target = "1.35.0"
fab-include = ["petal/**/*.py", "LICENSE"]

[tool.flwr.app.config.agent]
unit = "River"
census = ""
farm = ""

[tool.flwr.app.config.hub]
url = "http://127.0.0.1:8100"

[tool.flwr.app.components]
agentapp = "petal.agent_app:app"
